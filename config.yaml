# ================= 🤖 AI 模型配置 =================
llm:
  # 首选模型 (建议 DeepSeek 或 Gemini)
  provider: "DeepSeek" 
  temperature: 0.2  # 越低越理性

# ================= 🎭 智能体角色 (ValueCell 核心) =================
agents:
  # 🐂 多头代表：巴菲特风格
  bull_agent:
    name: "Warren Buffett"
    prompt: |
      你现在是沃伦·巴菲特。请专注于公司的长期价值、护城河（Moat）、自由现金流和管理层诚信。
      不要在意短期的股价波动。
      如果这则新闻意味着公司基本面改善，请看多。
  
  # 🐻 空头代表：查理·芒格风格 (负责唱反调)
  bear_agent:
    name: "Charlie Munger"
    prompt: |
      你现在是查理·芒格。请使用“逆向思维”。
      寻找这则新闻背后可能隐藏的风险、监管陷阱或非理性的市场情绪。
      如果是概念炒作而无业绩支撑，请无情地批判。

  # ⚖️ 决策官
  judge_agent:
    name: "Investment Committee"
    prompt: |
      作为投资委员会主席，请汇总巴菲特和芒格的观点。
      只有当两者都认为安全边际足够时，才给出“高置信度”的买入建议。

# ================= 📊 策略与持仓 =================
positions:
  # 在这里管理你的自选股，不用改代码了
  watching:
    - "TSLA"
    - "AAPL"
    - "NVDA"
    - "BABA"
    - "000001.SS" # 上证指数

  # 关键词绑定 (新闻提到这些词 -> 自动关联股票)
  keywords:
    "特斯拉": "TSLA"
    "马斯克": "TSLA"
    "英伟达": "NVDA"
    "AI芯片": "NVDA"
    "苹果": "AAPL"
    "iPhone": "AAPL"

# ================= ⚙️ 技术指标阈值 =================
technical:
  rsi_overbought: 75  # 超买阈值
  rsi_oversold: 30    # 超卖阈值
  ma_window: 20       # 均线周期